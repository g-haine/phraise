name: Apply reviewed title corrections

on:
  push:
    branches:
      - fix/audit-title-metadata

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BibReview v1.6.3
        run: python -m pip install "git+https://github.com/g-haine/bibreview.git@v1.6.3"

      - name: Apply reviewed canonical and BibTeX title corrections
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          titles = {
              "10.1016/j.ifacol.2015.09.324":
                  "Interconnection and damping assignment for implicit port-Hamiltonian systems",
              "10.1016/j.ifacol.2015.10.230":
                  "Dissipative boundary control systems with application to an isothermal tubular reactor",
              "10.1016/j.ifacol.2022.07.343":
                  "Learning Data-Driven PCHD Models for Control Engineering Applications",
              "10.3182/20100901-3-it-2016.00207":
                  "Design and experimental validation of a model reduction algorithm for high-order port-Hamiltonian systems",
              "10.3182/20110828-6-it-1002.02168":
                  "Passivity and Power Based Control of a Robot with Parallel Architecture",
              "10.1016/s1474-6670(17)38892-4":
                  "Regulation and Input Disturbance Suppression for Port-Controlled Hamiltonian Systems",
              "10.3166/ejc.15.599-612":
                  "Tracking of Partially Unknown Trajectories for Permanent Magnet Synchronous Motors",
              "10.1049/iet-cta.2017.0392":
                  "Energy‐based stabilisation and H∞ robust stabilisation of stochastic non‐linear systems",
              "10.2514/1.50446":
                  "Passivity-Based Control of a Rigid Electrodynamic Tether",
          }

          bib_paths = {
              "10.1016/j.ifacol.2015.09.324":
                  "docs/assets/bib/interconnection-and-damping-assignment-for-implicit-port-hamiltonian-systems-the-work-of-the-second-author-was-supported-by-the-research-grant-9-50-1197-2014-from-the-st-petersburg-state-university.bib",
              "10.1016/j.ifacol.2015.10.230":
                  "docs/assets/bib/dissipative-boundary-control-systems-with-application-to-an-isothermal-tubular-reactor-dissipative-boundary-control-systems-with-application-to-an-isothermal-tubular-reactor.bib",
              "10.1016/j.ifacol.2022.07.343":
                  "docs/assets/bib/learning-data-driven-pchd-models-for-control-engineering-applications.bib",
              "10.3182/20100901-3-it-2016.00207":
                  "docs/assets/bib/design-and-experimental-validation-of-a-model-reduction-algorithm-for-high-order-port-hamiltonian-systems.bib",
              "10.3182/20110828-6-it-1002.02168":
                  "docs/assets/bib/passivity-and-power-based-control-of-a-robot-with-parallel-architecture.bib",
              "10.1016/s1474-6670(17)38892-4":
                  "docs/assets/bib/regulation-and-input-disturbance-suppression-for-port-controlled-hamiltonian-systems-1.bib",
              "10.3166/ejc.15.599-612":
                  "docs/assets/bib/tracking-of-partially-unknown-trajectories-for-permanent-magnet-synchronous-motors.bib",
              "10.1049/iet-cta.2017.0392":
                  "docs/assets/bib/energy-based-stabilisation-and-robust-stabilisation-of-stochastic-non-linear-systems.bib",
              "10.2514/1.50446":
                  "docs/assets/bib/passivity-based-control-of-rigid-electrodynamic-tether.bib",
          }

          path = Path("docs/assets/data/bibliography.json")
          document = json.loads(path.read_text(encoding="utf-8"))

          found = set()
          changed = 0
          for publication in document["publications"]:
              doi = publication.get("identifiers", {}).get("doi")
              if doi not in titles:
                  continue
              found.add(doi)
              if publication["title"] != titles[doi]:
                  publication["title"] = titles[doi]
                  changed += 1

          if found != set(titles):
              missing = sorted(set(titles) - found)
              raise SystemExit(f"Missing canonical DOI(s): {missing}")
          if changed != 9:
              raise SystemExit(f"Expected 9 canonical title changes, got {changed}")

          path.write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          bib_changed = 0
          for doi, bib_path in bib_paths.items():
              bib = Path(bib_path)
              text = bib.read_text(encoding="utf-8")
              replacement = f"  title={{{{{titles[doi]}}}}},"
              updated, count = re.subn(
                  r"^  title=\{\{.*\}\},$",
                  lambda _: replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Expected one BibTeX title field in {bib_path}")
              if updated != text:
                  bib.write_text(updated, encoding="utf-8")
                  bib_changed += 1

          print(f"Canonical title corrections: {changed}")
          print(f"BibTeX title corrections: {bib_changed}")
          PY

      - name: Validate author mappings and render
        run: |
          bibreview authors
          bibreview --dry-run render
          bibreview render
          git diff --check

      - name: Commit reviewed corrections and generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-audit-title-corrections.yml
          git add -A
          git status --short
          git commit -m "Fix reviewed title audit findings"
          git push origin HEAD:fix/audit-title-metadata
