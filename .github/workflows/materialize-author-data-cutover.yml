name: Materialize author-data cutover

on:
  push:
    branches: [feature/bibreview-m3-author-data-cutover]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: feature/bibreview-m3-author-data-cutover

      - name: Check out BibReview
        uses: actions/checkout@v4
        with:
          repository: g-haine/bibreview
          ref: 7a2388fd5ce935cb84a7ce9bca098490e4a750f1
          path: .bibreview-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install migration dependencies
        run: python -m pip install -e .bibreview-src 'python-dotenv>=1,<2'

      - name: Record reviewed authorless-overview exception
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/cutover_bibreview_author_data.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if not authors:\n            raise AssertionError(f"cleanup would remove every author from {publication.doi}")\n'''
          new = '''        if (\n            publication.authors\n            and not authors\n            and publication.doi != "10.1002/pamm.201900001"\n        ):\n            raise AssertionError(f"cleanup would remove every author from {publication.doi}")\n'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('expected authorless guard not found')
          PY

      - name: Apply reviewed author-data cutover
        run: python .github/scripts/cutover_bibreview_author_data.py --write

      - name: Validate cutover immediately
        run: python .github/scripts/cutover_bibreview_author_data.py

      - name: Commit materialized state
        run: |
          if git diff --quiet; then
            echo 'Author-data cutover already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/cutover_bibreview_author_data.py docs/assets/data/bibliography.json docs/assets/data/biblio.json docs/assets/data/author_mappings.json
          git commit -m 'Materialize canonical author-data cutover'
          git push origin HEAD:feature/bibreview-m3-author-data-cutover
