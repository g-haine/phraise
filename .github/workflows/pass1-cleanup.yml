name: One-off mechanical bibliography cleanup

on:
  push:
    branches:
      - cleanup/mechanical-bibliography

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BibReview v1.0.0
        run: python -m pip install "git+https://github.com/g-haine/bibreview.git@v1.0.0"

      - name: Apply deterministic cleanup
        run: python .github/pass1_cleanup.py

      - name: Validate and render with pinned BibReview
        run: |
          bibreview --config bibreview.yml validate
          bibreview --config bibreview.yml render

      - name: Verify generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only -- docs/_posts | wc -l)" -eq 169
          test "$(git diff --name-only | wc -l)" -eq 170
          unexpected="$(
            git diff --name-only |
              grep -Ev '^(docs/assets/data/bibliography\.json|docs/_posts/.*\.md)$' || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-off migration scaffolding
        run: |
          rm .github/pass1_cleanup.py
          rm .github/workflows/pass1-cleanup.yml

      - name: Commit cleaned bibliography and rendered posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean historical bibliography data mechanically"
          git push origin HEAD:cleanup/mechanical-bibliography
