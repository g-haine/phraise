name: Update arXiv cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update_arxiv.py"
      - ".github/workflows/update-arxiv.yml"

permissions:
  contents: write

concurrency:
  group: update-arxiv-cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest arXiv entries
        run: python .github/scripts/update_arxiv.py

      - name: Commit cache if changed
        run: |
          if git diff --quiet -- docs/data/arxiv.json; then
            echo "No arXiv cache changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/arxiv.json
          git commit -m "Update arXiv cache"
          git push
