name: Update arXiv cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: update-arxiv-cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BibReview v1.6.40
        run: python -m pip install "git+https://github.com/g-haine/bibreview.git@v1.6.40"

      - name: Validate PHRAISE configuration
        run: bibreview --config bibreview.yml validate

      - name: Refresh arXiv cache
        id: refresh
        continue-on-error: true
        run: bibreview --config bibreview.yml arxiv

      - name: Report unavailable arXiv provider
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::arXiv refresh failed; keeping the existing cache unchanged."
          echo "No pull request will be created for this run."

      - name: Prepare automated pull request
        if: steps.refresh.outcome == 'success'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/assets/data/arxiv.json; then
            echo "No arXiv cache changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="automation/update-arxiv"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add site/assets/data/arxiv.json
          git commit -m "Update arXiv cache"
          git push --force origin "HEAD:refs/heads/$branch"

          sha="$(git rev-parse HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          number="$(gh pr list \
            --base main \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update arXiv cache" \
              --body "Automated BibReview arXiv cache refresh. This PR is merged automatically only after the PHRAISE integration workflow succeeds and the diff is verified to contain only site/assets/data/arxiv.json."
            number="$(gh pr list \
              --base main \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number')"
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Validate cache-only diff
        if: steps.refresh.outcome == 'success' && steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prepare.outputs.number }}
        run: |
          files="$(gh pr view "$PR_NUMBER" \
            --json files \
            --jq '.files[].path')"

          if [ "$files" != "site/assets/data/arxiv.json" ]; then
            printf 'Automated arXiv PR modifies unexpected files:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Dispatch PHRAISE integration validation
        if: steps.refresh.outcome == 'success' && steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: gh workflow run bibreview-integration.yml --ref "$BRANCH"

      - name: Wait for PHRAISE integration validation
        id: validation
        if: steps.refresh.outcome == 'success' && steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          EXPECTED_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow bibreview-integration.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$EXPECTED_SHA\") | .databaseId" \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "Could not find the dispatched BibReview integration run." >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Publish required integration commit status
        if: steps.refresh.outcome == 'success' && steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.prepare.outputs.sha }}
          VALIDATION_RUN_ID: ${{ steps.validation.outputs.run_id }}
        run: |
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID"

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" \
            -f state="success" \
            -f context="integration" \
            -f description="PHRAISE integration validation succeeded" \
            -f target_url="$target_url"

      - name: Wait for branch policy to recognize validation
        if: steps.refresh.outcome == 'success' && steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prepare.outputs.number }}
        run: |
          for _ in $(seq 1 30); do
            state="$(gh pr view "$PR_NUMBER" \
              --json mergeStateStatus \
              --jq '.mergeStateStatus')"
            echo "Merge state: $state"

            if [ "$state" = "CLEAN" ]; then
              exit 0
            fi

            case "$state" in
              BEHIND|DIRTY|DRAFT)
                echo "Pull request cannot become mergeable automatically: $state" >&2
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "Branch policy did not recognize the validated integration check." >&2
          exit 1

      - name: Merge validated arXiv pull request
        if: steps.refresh.outcome == 'success' && steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prepare.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch

      - name: Deploy updated site
        if: steps.refresh.outcome == 'success' && steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
