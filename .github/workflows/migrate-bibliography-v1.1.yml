name: One-shot BibReview v1.1 bibliography migration

on:
  push:
    branches:
      - cleanup/bibliography-contributors-v1.1
    paths:
      - ".github/scripts/migrate_bibliography_v1_1.py"
      - ".github/workflows/migrate-bibliography-v1.1.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BibReview 1.1 release commit
        run: python -m pip install "git+https://github.com/g-haine/bibreview.git@f5765599bfc98d7585b67d6142e5b3a4e8c3e432"

      - name: Apply reviewed bibliography migration
        run: python .github/scripts/migrate_bibliography_v1_1.py

      - name: Validate author identities
        run: bibreview --config bibreview.yml authors

      - name: Regenerate BibReview-owned Jekyll artifacts
        run: bibreview --config bibreview.yml render

      - name: Validate regenerated state is stable
        run: |
          bibreview --config bibreview.yml render
          git diff --check

      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Migration produced no tracked changes." >&2
            exit 1
          fi
          git commit -m "Repair bibliography contributors for BibReview v1.1"
          git push origin HEAD
