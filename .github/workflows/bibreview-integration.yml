name: BibReview integration

on:
  pull_request:
    branches: [bibreview-migration]
  workflow_dispatch:

jobs:
  migration-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PHRAISE migration branch
        uses: actions/checkout@v4

      - name: Check out BibReview
        uses: actions/checkout@v4
        with:
          repository: g-haine/bibreview
          ref: f5e3197ff7ead6f37573f29fb631f59c35806c22
          path: .bibreview-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install migration test dependencies
        run: python -m pip install -e .bibreview-src 'python-dotenv>=1,<2'

      - name: Validate real PHRAISE bibliography through BibReview
        run: python .github/scripts/validate_bibreview_compat.py

      - name: Compare historical and BibReview collection paths
        run: python .github/scripts/compare_bibreview_collect.py

      - name: Compare PHRAISE concatenate with BibReview merge/storage
        run: python .github/scripts/compare_bibreview_merge.py

      - name: Validate BibReview merge CLI on a canonical PHRAISE mirror
        run: python .github/scripts/compare_bibreview_merge_cli.py

      - name: Audit one-shot canonical state migration
        run: python .github/scripts/audit_bibreview_state_migration.py

      - name: Confirm migration branch is unchanged
        run: git diff --exit-code
