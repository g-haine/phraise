name: BibReview integration

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "site/assets/data/arxiv.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PHRAISE
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BibReview v1.6.42
        run: python -m pip install "git+https://github.com/g-haine/bibreview.git@v1.6.42"

      - name: Confirm BibReview version
        run: test "$(bibreview --version)" = "bibreview 1.6.42"

      - name: Validate PHRAISE BibReview configuration
        run: bibreview --config bibreview.yml validate

      - name: Generate first reviewed DOI-less import
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/import-heat-wave-2022'
        env:
          IMPORT_MANIFEST: manual-imports/long-time-behavior-heat-wave-2022.yml
        run: |
          bibreview --config bibreview.yml --dry-run import "$IMPORT_MANIFEST"
          bibreview --config bibreview.yml import "$IMPORT_MANIFEST"
          bibreview --config bibreview.yml --dry-run merge
          bibreview --config bibreview.yml merge
          bibreview --config bibreview.yml authors
          bibreview --config bibreview.yml render

          rm "$IMPORT_MANIFEST"
          rmdir manual-imports 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import DOI-less heat-wave publication"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Validate canonical project state
        run: bibreview --config bibreview.yml --dry-run merge

      - name: Validate canonical identifier registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path("data/bibliography.json").read_text(
                  encoding="utf-8"
              )
          )
          publications = document["publications"]
          registry = [
              line.strip()
              for line in Path("data/ID.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]

          expected = []
          for publication in publications:
              doi = publication.get("identifiers", {}).get("doi")
              if doi:
                  expected.append(f"doi:{doi}")
              else:
                  expected.append(f"id:{publication['id'].lower()}")

          if len(registry) != len(publications):
              raise SystemExit(
                  "ID.txt cardinality mismatch: "
                  f"{len(registry)} tokens for {len(publications)} publications"
              )

          if registry != expected:
              for index, (actual, wanted) in enumerate(
                  zip(registry, expected, strict=True),
                  1,
              ):
                  if actual != wanted:
                      raise SystemExit(
                          f"ID.txt projection mismatch at line {index}: "
                          f"{actual!r} != {wanted!r}"
                      )
              raise SystemExit("ID.txt projection differs from bibliography")

          print(
              f"Canonical identifier registry: {len(registry)} "
              "tokens for the same number of publications"
          )
          PY

      - name: Validate audit planning
        run: bibreview --config bibreview.yml --dry-run audit --batch-size 1

      - name: Validate canonical author mappings
        run: bibreview --config bibreview.yml authors

      - name: Render PHRAISE through BibReview
        run: bibreview --config bibreview.yml render

      - name: Confirm BibReview render is a tracked-tree no-op
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Check search JavaScript syntax
        run: |
          node --check site/assets/js/search.js
          node --check site/assets/js/search-worker.js

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: site

      - name: Build PHRAISE Jekyll site
        working-directory: site
        run: bundle exec jekyll build

      - name: Validate displayed bibliography update date
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          document = json.loads(
              Path("data/bibliography.json").read_text(
                  encoding="utf-8"
              )
          )
          value = document["metadata"]["last_update"]
          if value is None:
              raise SystemExit("canonical bibliography last_update is null")
          date = datetime.date.fromisoformat(value)
          expected = f"the {date:%d} of {date:%B} ({date:%Y})"
          html = Path("site/_site/index.html").read_text(encoding="utf-8")
          if expected not in html:
              raise SystemExit(
                  f"homepage does not display canonical last_update: {expected}"
              )
          print(f"Homepage bibliography date: {expected}")
          PY
