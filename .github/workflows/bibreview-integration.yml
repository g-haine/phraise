name: BibReview integration

on:
  pull_request:
    branches: [bibreview-migration]
  workflow_dispatch:

jobs:
  migration-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PHRAISE migration branch
        uses: actions/checkout@v4

      - name: Check out BibReview
        uses: actions/checkout@v4
        with:
          repository: g-haine/bibreview
          ref: a110fa603418314ba355fe735b6a2185a06533a8
          path: .bibreview-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install migration test dependencies
        run: python -m pip install -e .bibreview-src 'python-dotenv>=1,<2'

      - name: Validate canonical PHRAISE state cutover
        run: python .github/scripts/validate_bibreview_cutover.py

      - name: Check deterministic legacy projection
        run: python docs/projectLegacyBibliography.py --check

      - name: Validate BibReview merge CLI on authoritative state
        run: bibreview --config bibreview.yml --dry-run merge

      - name: Compare PHRAISE and BibReview discovery/relevance paths
        run: python .github/scripts/compare_bibreview_discovery.py

      - name: Compare PHRAISE and BibReview refresh/recollect paths
        run: python .github/scripts/compare_bibreview_refresh.py

      - name: Compare historical and BibReview collection paths
        run: python .github/scripts/compare_bibreview_collect.py

      - name: Exercise BibReview project collection on PHRAISE mirror
        run: python .github/scripts/compare_bibreview_project_collect.py

      - name: Compare PHRAISE concatenate with BibReview merge/storage
        run: python .github/scripts/compare_bibreview_merge.py

      - name: Validate canonical author-data cutover
        run: python .github/scripts/cutover_bibreview_author_data.py

      - name: Validate BibReview author CLI on authoritative state
        run: bibreview --config bibreview.yml authors

      - name: Validate renderer-independent BibReview site model
        run: python .github/scripts/compare_bibreview_site_model.py

      - name: Validate legacy author-page bridge
        run: python docs/setPages.py --dry-run

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Build PHRAISE Jekyll site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build

      - name: Confirm tracked migration state is unchanged
        run: git diff --exit-code
