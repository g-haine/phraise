name: BibReview integration

on:
  pull_request:
    branches: [bibreview-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PHRAISE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check out BibReview
        uses: actions/checkout@v4
        with:
          repository: g-haine/bibreview
          ref: 1a21e6366a619bf9302cf758ba391570a74666d0
          path: .bibreview-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migrate canonical bibliography document once
        run: python .github/scripts/migrate_bibliography_document.py

      - name: Commit canonical bibliography migration if needed
        run: |
          if [ -z "$(git status --porcelain -- docs/assets/data/bibliography.json)" ]; then
            echo "Canonical bibliography already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/bibliography.json
          git commit -m "Migrate canonical bibliography document"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Install BibReview
        run: python -m pip install -e .bibreview-src

      - name: Validate PHRAISE BibReview configuration
        run: bibreview --config bibreview.yml validate

      - name: Validate canonical merge state
        run: bibreview --config bibreview.yml --dry-run merge

      - name: Validate canonical author mappings
        run: bibreview --config bibreview.yml authors

      - name: Render PHRAISE through BibReview
        run: bibreview --config bibreview.yml render

      - name: Confirm BibReview render is a tracked-tree no-op
        run: test -z "$(git status --porcelain)"

      - name: Check search JavaScript syntax
        run: |
          node --check docs/assets/js/search.js
          node --check docs/assets/js/search-worker.js

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Build PHRAISE Jekyll site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build

      - name: Confirm tracked project state is unchanged
        run: test -z "$(git status --porcelain)"
