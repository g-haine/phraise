name: BibReview integration

on:
  pull_request:
    branches: [bibreview-migration]
  workflow_dispatch:

jobs:
  real-bibliography-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PHRAISE migration branch
        uses: actions/checkout@v4

      - name: Check out BibReview
        uses: actions/checkout@v4
        with:
          repository: g-haine/bibreview
          ref: c11eca51a1d9d35b31d882caab73492324e58dd5
          path: .bibreview-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BibReview
        run: python -m pip install -e .bibreview-src

      - name: Validate real PHRAISE bibliography through BibReview
        run: python .github/scripts/validate_bibreview_compat.py

      - name: Confirm migration branch is unchanged
        run: git diff --exit-code
