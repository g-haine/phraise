name: BibReview integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PHRAISE
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BibReview v1.0.0
        run: python -m pip install "git+https://github.com/g-haine/bibreview.git@v1.0.0"

      - name: Confirm BibReview version
        run: test "$(bibreview --version)" = "bibreview 1.0.0"

      - name: Validate PHRAISE BibReview configuration
        run: bibreview --config bibreview.yml validate

      - name: Validate optional arXiv module configuration
        run: bibreview --config bibreview.yml status

      - name: Assert PHRAISE contains no project Python engine
        run: |
          files="$(find . -path './.git' -prune -o -name '*.py' -print)"
          if [ -n "$files" ]; then
            printf 'Unexpected Python files in PHRAISE:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Validate canonical merge state
        run: bibreview --config bibreview.yml --dry-run merge

      - name: Validate canonical author mappings
        run: bibreview --config bibreview.yml authors

      - name: Render PHRAISE through BibReview
        run: bibreview --config bibreview.yml render

      - name: Confirm BibReview render is a tracked-tree no-op
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Check search JavaScript syntax
        run: |
          node --check docs/assets/js/search.js
          node --check docs/assets/js/search-worker.js

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: docs

      - name: Build PHRAISE Jekyll site
        working-directory: docs
        run: bundle exec jekyll build

      - name: Validate displayed bibliography update date
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          document = json.loads(
              Path("docs/assets/data/bibliography.json").read_text(
                  encoding="utf-8"
              )
          )
          value = document["metadata"]["last_update"]
          if value is None:
              raise SystemExit("canonical bibliography last_update is null")
          date = datetime.date.fromisoformat(value)
          expected = f"the {date:%d} of {date:%B} ({date:%Y})"
          html = Path("docs/_site/index.html").read_text(encoding="utf-8")
          if expected not in html:
              raise SystemExit(
                  f"homepage does not display canonical last_update: {expected}"
              )
          print(f"Homepage bibliography date: {expected}")
          PY

      - name: Confirm tracked project state is unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
