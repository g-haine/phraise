schema_version: 1

environment:
  file: docs/.env

project:
  name: PHRAISE
  slug: phraise
  title: Port-Hamiltonian Representation and Approximation of Interconnected Systems using Energy
  description: Bibliographic survey dedicated to research on port-Hamiltonian systems
  repository: https://github.com/g-haine/phraise
  contact:
    name: Ghislain Haine
    email: ghislain.haine@isae.fr

arxiv:
  enabled: true
  query: all:port AND all:Hamiltonian
  max_results: 25
  sort_by: lastUpdatedDate
  sort_order: descending
  output: docs/assets/data/arxiv.json

paths:
  bibliography: docs/assets/data/bibliography.json
  collected: docs/assets/data/collected.json
  author_mappings: docs/assets/data/author_mappings.json
  known: docs/DOI.txt
  pending: docs/newDOI.txt
  rejected: docs/badDOI.txt
  review: docs/checkDOI.txt
  bibtex: docs/assets/bib
  archive: docs/trash
  site: docs

discovery:
  provider: openalex
  query: port-Hamiltonian
  max_pages: 20
  accepted_types:
    - journal-article
    - proceedings-article
    - book-chapter
    - book
    - monograph
  exclude_doi_substrings:
    - arxiv
    - zenodo

refresh:
  types:
    - journal-article
  when_missing_any:
    - volume
    - issue
    - pages

audit:
  campaign: audit/campaign.json
  report: audit/report.json
  batch_size: 50

relevance:
  patterns:
    - 'port[-\s]+(controlled )?hamiltonian'
    - 'interconnection and damping assignment'
    - 'dirac structure'
    - 'dissipative hamiltonian'
  unmatched: manual-review

providers:
  crossref:
    enabled: true
    min_interval_seconds: 0.5
  openalex:
    enabled: true
    min_interval_seconds: 0.5
    api_key_env: OPENALEX_API_KEY
  elsevier:
    enabled: true
    min_interval_seconds: 0.5
    api_key_env: SCOPUS_API_KEY
  springer:
    enabled: true
    min_interval_seconds: 0.5
    api_key_env: SPRINGER_API_KEY
  ieee:
    enabled: true
    min_interval_seconds: 0.5
    api_key_env: IEEE_API_KEY
  semantic_scholar:
    enabled: true
    min_interval_seconds: 1.5
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
  mendeley:
    enabled: true
    min_interval_seconds: 0.5
    client_id_env: MENDELEY_CLIENT_ID
    client_secret_env: MENDELEY_CLIENT_SECRET

site:
  enabled: true
  implementation: jekyll
  template: default
  source: docs
  url: https://g-haine.github.io
  baseurl: /phraise
  search: true
  branding:
    logo: assets/img/logo.webp
    favicon: assets/img/favicon.ico
  jekyll:
    include_authorless_year_publications: false
    author_index_extra_html: |
      <p id='info-authors'>For <a href='{{ site.baseurl }}/about/#handling-authors-names'>simplicity</a>, the authors are sorted using the last word of their name.<br />For example, <i>Arjan van der Schaft</i> appears under the letter <strong>S</strong>, and <i>Yann Le Gorrec</i> under the letter <strong>G</strong>.</p>
      <p>You may want to look at <a href='{{ site.baseurl }}/assets/data/author_mappings.json'>the array managing name variations</a> (a JSON file) for verification/correction.</p>
      <hr />
    category_by_type:
      journal-article: articles
      proceedings-article: proceedings
      book-chapter: chapters
      book: books
      monograph: books
    event_category_rules:
      - pattern: 'Conference|Workshop|Symposium|Congress|Proceeding|Consortium'
        category: proceedings
    isbn_types:
      - book
      - book-chapter
      - monograph
