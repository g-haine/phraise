
<script>
    function convertLatexToMathJax(text) {
        // Remplace les blocs $$...$$ par \[...\]
        let blockParts = text.split('$$');
        for (let i = 1; i < blockParts.length; i += 2) {
            blockParts[i] = `\\[${blockParts[i]}\\]`;
        }
        text = blockParts.join('');

        // Remplace les inline $...$ par \(...\)
        let inlineParts = text.split('$');
        for (let i = 1; i < inlineParts.length; i += 2) {
            inlineParts[i] = `\\(${inlineParts[i]}\\)`;
        }
        return inlineParts.join('');
    }

    async function fetchPortHamiltonianPapers() {
        const loader = document.getElementById("arxiv-loader");
        const list = document.getElementById("arxiv-list");
        loader.style.display = "block";

        try {
            const response = await fetch("{{ '/data/arxiv.json' | relative_url }}", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    `arXiv cache HTTP error: ${response.status} ${response.statusText}`
                );
            }

            const data = await response.json();
            const papers = data.papers;

            if (!Array.isArray(papers) || papers.length === 0) {
                throw new Error("arXiv cache contains no papers");
            }

            list.innerHTML = "";

            for (const paper of papers) {
                const title = convertLatexToMathJax(paper.title || "");
                const summary = convertLatexToMathJax(paper.summary || "");
                const authors = Array.isArray(paper.authors) ? paper.authors : [];

                const li = document.createElement("li");
                li.innerHTML = `
                  <span class="post-meta">${paper.updated || ""} -- ${authors.join(", ")}</span>
                  <h3>
                    <a class="post-link" href="${paper.url || "#"}" target="_blank" rel="noopener">
                      ${title}
                    </a>
                  </h3>
                  <p><strong>Abstract:</strong> ${summary}</p>
                `;
                list.appendChild(li);
            }

            if (window.MathJax && MathJax.typeset) {
                MathJax.typeset();
            }
        } catch (error) {
            console.error("arXiv cache error:", error);
            list.innerHTML = `
              <li>
                <p><strong>Unable to load the latest arXiv updates.</strong></p>
                <p>Please try again later.</p>
              </li>
            `;
        } finally {
            loader.style.display = "none";
        }
    }

    document.addEventListener("DOMContentLoaded", fetchPortHamiltonianPapers);
</script>
